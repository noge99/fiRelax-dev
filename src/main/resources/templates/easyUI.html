<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{default}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parameter Inputs</title>
    <link rel="stylesheet" href="/css/navbar.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div layout:fragment="content">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="dataForm" class="mb-4">
                    <h3 class="text-center">Parameters</h3>
                    <div id="parameters"></div>
                    <h4 class="text-center">Data Input</h4>
                    <div id="dataInput"></div>
                    <div class="text-center">
                        <button id="submit-button" class="btn btn-outline-success" type="submit">Submit</button>
                    </div>
                </form>
                <div id="responseMessage" class="text-center"></div>
                <div class="text-center">
                    <button id="plot-button" class="btn btn-danger">Plot</button>
                    <button id="fit-button" class="btn btn-warning">Fit</button>
                </div>
                <div id="plot" style="width: 100%; height: 500px;"></div>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="/js/SBM_params.js"></script>
<script src="/js/plotly.js"></script>
</body>
</html>
